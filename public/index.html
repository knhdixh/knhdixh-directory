<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knhdixh</title>
<meta name="description" content="Things running at knhdixh.com.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --fg: #000; --muted: #8a8a8a; --bg: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 400 15px/1.6 "Inter", system-ui, -apple-system, sans-serif;
    letter-spacing: -0.005em;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 22vh 24px 80px;
  }
  h1 {
    font-size: 15px; font-weight: 500;
    margin: 0 0 48px;
    min-height: 1.6em;
  }
  .cursor {
    display: inline-block;
    width: 1px; height: 1.1em;
    margin-left: 2px;
    background: var(--fg);
    vertical-align: -0.18em;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .6s ease, transform .6s ease;
  }
  li.in { opacity: 1; transform: none; }
  a {
    display: flex; justify-content: space-between; gap: 24px;
    padding: 10px 0;
    color: var(--fg); text-decoration: none;
  }
  a .name { position: relative; }
  a .name::after {
    content: ""; position: absolute; left: 0; right: 100%; bottom: 1px;
    height: 1px; background: var(--fg);
    transition: right .3s ease;
  }
  a:hover .name::after, a:focus-visible .name::after { right: 0; }
  a:focus-visible { outline: none; }
  a .what { color: var(--muted); }

  footer {
    margin-top: 64px;
    color: var(--muted);
    opacity: 0; transition: opacity .8s ease;
  }
  footer.in { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    li, footer { transition: none; }
    .cursor { animation: none; }
  }
</style>
</head>
<body>
<main>
  <h1><span id="type"></span><span class="cursor" aria-hidden="true"></span></h1>

  <ul>
    <li><a href="https://epita.knhdixh.com"><span class="name">epita</span><span class="what">attendance</span></a></li>
    <li><a href="https://epita-staging.knhdixh.com"><span class="name">epita-staging</span><span class="what">attendance, staging</span></a></li>
    <li><a href="https://n8n.knhdixh.com"><span class="name">n8n</span><span class="what">automation</span></a></li>
    <li><a href="https://ciggs.knhdixh.com"><span class="name">ciggs</span><span class="what">nicotine taper</span></a></li>
  </ul>

  <footer>knhdixh.com</footer>
</main>

<script>
  (function () {
    var text = "knhdixh";
    var el = document.getElementById("type");
    var items = document.querySelectorAll("li");
    var footer = document.querySelector("footer");
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function reveal() {
      items.forEach(function (li, i) {
        setTimeout(function () { li.classList.add("in"); }, reduced ? 0 : 120 * i);
      });
      setTimeout(function () { footer.classList.add("in"); }, reduced ? 0 : 120 * items.length + 200);
    }

    if (reduced) { el.textContent = text; reveal(); return; }

    var i = 0;
    setTimeout(function tick() {
      el.textContent = text.slice(0, ++i);
      if (i < text.length) setTimeout(tick, 70 + Math.random() * 70);
      else setTimeout(reveal, 300);
    }, 500);
  })();
</script>
</body>
</html>
